version: '3.9'

services:
  db:
    image: postgres:16
    container_name: tech4um-db
    environment:
      POSTGRES_USER: tech4um
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: tech4um
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: tech4um-backend
    ports:
      - '8000:8000'
    volumes:
      - ./backend:/app
    depends_on:
      - db
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql+psycopg2://tech4um:changeme@db:5432/tech4um
      - SECRET_KEY=change-this-secret-key
      - ACCESS_TOKEN_EXPIRE_MINUTES=60

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tech4um-frontend
    ports:
      - '3000:80'
    depends_on:
      - backend

volumes:
  db_data:
